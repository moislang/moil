name: Planning documentation

on:
  push:
    branches: [master]
    paths:
      - 'README.md'
      - 'docs/**'
      - '.claude/**'
      - 'scripts/validate-planning-docs.py'
      - '.github/workflows/planning-docs.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - '.claude/**'
      - 'scripts/validate-planning-docs.py'
      - '.github/workflows/planning-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planning-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate planning structure and local links
        run: python3 scripts/validate-planning-docs.py
