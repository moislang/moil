name: Extended platforms

# macOS x86_64 and Windows ARM64, kept out of pull requests so they stay
# fast. Runs weekly and on demand:
#   gh workflow run extended-platforms.yml
# The official snl release has no binary for them, so setup-snl downloads
# the snl seed binaries published once by publish-snl-seed.yml (no build).

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cli:
    name: ${{ matrix.platform }} CLI
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS x86_64
            runner: macos-15-intel
            shell: bash
          - platform: Windows ARM64
            runner: windows-11-arm
            shell: msys2 {0}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: CLANGARM64
          update: false
          cache: true
          install: make diffutils mingw-w64-clang-aarch64-clang
      - id: snl
        uses: ./.github/actions/setup-snl
      - name: Build and test the Snova CLI
        run: make -j1 bootstrap-smoke bootstrap-fixed-point bootstrap-vm bootstrap-oop bootstrap-target-cli
        env:
          SNL: ${{ steps.snl.outputs.snl }}
