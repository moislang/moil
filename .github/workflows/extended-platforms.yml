name: Extended platforms

# Platforms without an official snl binary (macOS x86_64, Windows ARM64).
# Kept out of pull requests to keep them fast; runs weekly and on demand:
#   gh workflow run extended-platforms.yml
# The seed is built from snovac at the commit of the official v0.3.0 tag,
# cached per platform so later runs skip the build.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SNL_SEED_REVISION: 590a490d45719a742fb0e487753ab70cc6f91656

jobs:
  cli:
    name: ${{ matrix.platform }} CLI
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS x86_64
            runner: macos-15-intel
            shell: bash
            msystem: ''
            packages: ''
            seed_cc: cc
            seed_cli: seed/build/snl
          - platform: Windows ARM64
            runner: windows-11-arm
            shell: msys2 {0}
            msystem: CLANGARM64
            packages: make git diffutils mingw-w64-clang-aarch64-clang
            seed_cc: clang
            seed_cli: seed/build/snl.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: snovalang/snovac
          ref: ${{ env.SNL_SEED_REVISION }}
          path: seed
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          cache: true
          install: ${{ matrix.packages }}
      - id: seed-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: seed/build
          key: snl-seed-${{ env.SNL_SEED_REVISION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build the seed (cache miss only)
        if: steps.seed-cache.outputs.cache-hit != 'true'
        run: make -C seed -j4 CC=${{ matrix.seed_cc }}
      - name: Build and test the Snova CLI
        run: make -j1 bootstrap-smoke bootstrap-fixed-point bootstrap-vm bootstrap-oop bootstrap-target-cli
        env:
          SNL: ${{ matrix.seed_cli }}
