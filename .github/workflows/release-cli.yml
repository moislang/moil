name: Moil CLI release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (MAJOR.MINOR.PATCH[-pre]); manual runs upload artifacts only'
        required: true
        default: '0.1.0-preview.1'

permissions:
  contents: read

jobs:
  cli:
    name: ${{ matrix.platform }} CLI
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            shell: bash
          - platform: darwin-aarch64
            runner: macos-15
            shell: bash
          - platform: darwin-x86_64
            runner: macos-15-intel
            shell: bash
          - platform: windows-x86_64
            runner: windows-2025
            shell: msys2 {0}
            msystem: MINGW64
            packages: make diffutils mingw-w64-x86_64-gcc zip
          - platform: windows-aarch64
            runner: windows-11-arm
            shell: msys2 {0}
            msystem: CLANGARM64
            packages: make diffutils mingw-w64-clang-aarch64-clang zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          cache: true
          install: ${{ matrix.packages }}
      - id: moil
        uses: ./.github/actions/setup-snl
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::version '$version' is not MAJOR.MINOR.PATCH[-pre]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and verify the Moil CLI
        run: make -j1 bootstrap-smoke bootstrap-fixed-point bootstrap-vm bootstrap-oop bootstrap-target-cli
        env:
          MOIL: ${{ steps.moil.outputs.moil }}
      - name: Package CLI
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist/stage
          if [ "$RUNNER_OS" = Windows ]; then
            cp build/bootstrap/mois-bootstrap.exe dist/stage/moil.exe
          else
            cp build/bootstrap/mois-bootstrap dist/stage/moil
            chmod +x dist/stage/moil
          fi
          cp LICENSE NOTICE dist/stage/
          cp docs/roadmap/subset.md dist/stage/supported-subset.md
          cp docs/roadmap/maturity.md dist/stage/known-limitations.md
          if [ "$RUNNER_OS" = Windows ]; then
            archive="dist/moil-$VERSION-$PLATFORM.zip"
            (cd dist/stage && zip -qr "../moil-$VERSION-$PLATFORM.zip" .)
          else
            archive="dist/moil-$VERSION-$PLATFORM.tar.gz"
            tar -czf "$archive" -C dist/stage .
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: moil-cli-${{ matrix.platform }}
          path: dist/moil-*
          if-no-files-found: error

  release:
    name: Attach CLI archives to GitHub release
    if: github.ref_type == 'tag'
    needs: cli
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: moil-cli-*
          path: dist
          merge-multiple: true
      - name: Create release if needed and upload CLI archives
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          tag="$VERSION"
          version="${tag#v}"
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            prerelease=""
            case "$version" in *-*) prerelease="--prerelease";; esac
            if ! gh release create "$tag" -R "$GITHUB_REPOSITORY" $prerelease --verify-tag \
              --title "Moislang CLI $version" \
              --notes "Moislang CLI archives for Linux, macOS and Windows. The native backend support matrix is documented in the repository."; then
              gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null
            fi
          fi
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber dist/*
