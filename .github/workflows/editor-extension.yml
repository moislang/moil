name: Editor extension

# Packages editors/vscode as a .vsix with zip only (make editor-vscode-vsix)
# and installs it in a throwaway VS Code extensions directory to check it.
# On a vX.Y.Z[-pre] tag the .vsix is attached to the GitHub release, so
# anyone in the organization can `code --install-extension` it (ADR-0011).

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'editors/**'
      - '.github/workflows/editor-extension.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  vsix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check JSON files
        run: for f in editors/vscode/*.json editors/vscode/syntaxes/*.json; do python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; done
      - name: Build .vsix
        run: make editor-vscode-vsix
      - name: Check the package layout
        run: |
          vsix=$(ls build/editors/*.vsix)
          for entry in '[Content_Types].xml' extension.vsixmanifest extension/package.json extension/syntaxes/snovalang.tmLanguage.json extension/icons/snl.svg; do
            unzip -l "$vsix" | grep -qF " $entry" || { echo "::error::$entry missing from $vsix"; exit 1; }
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snovalang-vscode
          path: build/editors/*.vsix
          if-no-files-found: error
      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          prerelease=""; case "$version" in *-*) prerelease="--prerelease";; esac
          gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$tag" -R "$GITHUB_REPOSITORY" $prerelease --verify-tag --title "Snovalang Compiler $version" --notes "" \
            || true
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber build/editors/*.vsix
