name: Publish moil seed binaries

# Publish one pinned compiler build for each CI platform. The source is private,
# so this is the only workflow that needs SNL_SOURCE_TOKEN; normal CI downloads
# the resulting checksummed archives from this repository.
#
# Run: push the tag `snl-seed-v0.3.1-mois-ext.1`, or dispatch this workflow.
# (workflow_dispatch builds and uploads artifacts without a release).

on:
  push:
    tags: ['snl-seed-v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  SNL_VERSION: v0.3.1-mois-ext.1
  SNOVAC_VERSION: 0.3.1-mois-ext.1
  # First compiler revision that accepts .moi/.mos; fail if the pin moves.
  SNL_COMMIT: 27e685a33ec6bad3dfc972bbcd3d1659992a0bf2

jobs:
  build:
    name: moil ${{ matrix.asset_platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_platform: darwin-aarch64
            runner: macos-15
            shell: bash
          - asset_platform: darwin-x86_64
            runner: macos-15-intel
            shell: bash
          - asset_platform: linux-x86_64
            runner: ubuntu-24.04
            shell: bash
          - asset_platform: windows-x86_64
            runner: windows-2025
            shell: msys2 {0}
            msystem: MINGW64
            packages: git make python diffutils mingw-w64-x86_64-gcc zip
          - asset_platform: windows-aarch64
            runner: windows-11-arm
            shell: msys2 {0}
            msystem: CLANGARM64
            packages: git make python diffutils mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-llvm-tools zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: repo
      - name: Check the source token
        shell: bash
        env:
          SNL_SOURCE_TOKEN: ${{ secrets.SNL_SOURCE_TOKEN }}
        run: |
          if [ -z "$SNL_SOURCE_TOKEN" ]; then
            echo "::error::set the SNL_SOURCE_TOKEN secret (read access to the private moislang/snovac)"; exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: moislang/snovac
          ref: ${{ env.SNL_COMMIT }}
          path: snovac-src
          token: ${{ secrets.SNL_SOURCE_TOKEN }}
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: ${{ matrix.packages }}
      - name: Check the tag commit
        run: |
          actual=$(git -C snovac-src rev-parse HEAD)
          if [ "$actual" != "$SNL_COMMIT" ]; then
            echo "::error::$SNL_VERSION is $actual, expected $SNL_COMMIT"; exit 1
          fi
      - name: Build the compiler
        if: runner.os != 'Windows'
        run: make -C snovac-src clean && make -C snovac-src -j4 SNOVAC_VERSION="$SNOVAC_VERSION"
      - name: Build the compiler (Windows)
        if: runner.os == 'Windows'
        run: |
          compiler=gcc
          if [ "$RUNNER_ARCH" = ARM64 ]; then compiler=clang; fi
          make -C snovac-src clean OS=Windows_NT
          make -C snovac-src -j4 OS=Windows_NT CC="$compiler" EXTRA_LIBS="-lws2_32 -static" SNOVAC_VERSION="$SNOVAC_VERSION"
          # A static build imports only DLLs that ship with Windows.
          if [ "$RUNNER_ARCH" = ARM64 ]; then objdump=llvm-objdump; else objdump=objdump; fi
          $objdump -p snovac-src/build/snl.exe | sed -n 's/^\s*DLL Name: //p' | tr -d '\r' | tee dlls.txt
          if grep -viE '^(kernel32|msvcrt|ucrtbase|advapi32|user32|shell32|ws2_32|bcrypt|ntdll|api-ms-win-.*)\.dll$' dlls.txt; then
            echo "::error::snl.exe imports DLLs that Windows does not provide"; exit 1
          fi
      - name: Package
        run: |
          exe=snl; [ "$RUNNER_OS" = Windows ] && exe=snl.exe
          name="snl-$SNL_VERSION-${{ matrix.asset_platform }}"
          mkdir -p dist/stage/bin
          cp "snovac-src/build/$exe" "dist/stage/bin/$exe"
          cp -R snovac-src/builtin dist/stage/builtin
          test -f dist/stage/builtin/io/console/Console.moi
          test "$("dist/stage/bin/$exe" --version)" = "snl $SNOVAC_VERSION"
          if [ "$RUNNER_OS" = Windows ]; then
            # zip writes '/' separators; Windows PowerShell's Compress-Archive writes '\\'.
            (cd dist/stage && zip -qr "../$name.zip" bin builtin)
            archive="$name.zip"
          else
            tar -czf "dist/$name.tar.gz" -C dist/stage bin builtin
            archive="$name.tar.gz"
          fi
          (cd dist && { command -v sha256sum > /dev/null && sha256sum "$archive" || shasum -a 256 "$archive"; } > "$name.sha256")
          cat "dist/$name.sha256"
      - name: Smoke test the packaged seed on this repository
        run: |
          mkdir -p check && cd check
          case "$RUNNER_OS" in
            Windows) unzip -q ../dist/*.zip ;;
            *) tar -xzf ../dist/*.tar.gz ;;
          esac
          cd ..
          if [ "$RUNNER_OS" = Windows ]; then
            mv check/bin/snl.exe check/bin/moil.exe
            moil="$PWD/check/bin/moil.exe"
          else
            mv check/bin/snl check/bin/moil
            moil="$PWD/check/bin/moil"
          fi
          make -C repo bootstrap-smoke MOIL="$moil"
          cat > check/Extension.mos <<'EOF'
          func main(): int { return 37 }
          EOF
          if "$moil" run check/Extension.mos; then
            echo "::error::.mos probe unexpectedly returned zero"; exit 1
          else
            result=$?
            if [ "$result" -ne 37 ]; then
              echo "::error::.mos probe returned $result, expected 37"; exit 1
            fi
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snl-${{ matrix.asset_platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish snl-seed release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: snl-*
          path: dist
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          ls -l dist
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --prerelease --verify-tag \
              --title "Moil bootstrap seed $SNL_VERSION" \
              --notes "Checksummed CI toolchain binaries built from moislang/snovac commit $SNL_COMMIT. Supports .moi and .mos sources; Mois CI images use .mlbc. The setup action exposes the compiler as moil. This is a toolchain seed, not a Moislang compiler-language release."
          fi
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber dist/*
