name: Publish snl seed binaries

# The official snl release has no binary for macOS x86_64 or Windows ARM64.
# This workflow builds snl ONCE for those platforms, from the commit of the
# official tag, with the same flags and archive layout as the official
# release (bin/snl + builtin/), and publishes them as assets of the
# prerelease `snl-seed-<version>`. CI then downloads them through
# .github/actions/setup-snl like the official binaries; no CI run builds snl.
# It is the only workflow that touches the snl sources.
#
# Run: push the tag `snl-seed-v0.3.0`, or `gh workflow run publish-snl-seed.yml`
# (workflow_dispatch builds and uploads artifacts without a release).

on:
  push:
    tags: ['snl-seed-v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  SNL_VERSION: v0.3.0
  # Commit of the official snl v0.3.0 tag; the build fails if the tag moved.
  SNL_COMMIT: 590a490d45719a742fb0e487753ab70cc6f91656

jobs:
  build:
    name: snl ${{ matrix.asset_platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_platform: darwin-x86_64
            runner: macos-15-intel
            shell: bash
          - asset_platform: windows-aarch64
            runner: windows-11-arm
            shell: msys2 {0}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: repo
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: snovalang/snovac
          ref: ${{ env.SNL_VERSION }}
          path: snl-src
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: CLANGARM64
          update: false
          install: make grep gawk diffutils python unzip mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-llvm-tools
      - name: Check the tag commit
        run: |
          actual=$(git -C snl-src rev-parse HEAD)
          if [ "$actual" != "$SNL_COMMIT" ]; then
            echo "::error::$SNL_VERSION is $actual, expected $SNL_COMMIT"; exit 1
          fi
      - name: Build snl (macOS)
        if: runner.os == 'macOS'
        run: make -C snl-src clean && make -C snl-src -j4
      - name: Build snl (Windows, static like the official release)
        if: runner.os == 'Windows'
        run: |
          if ! command -v python > /dev/null 2>&1; then
            mkdir -p /usr/local/bin
            printf '%s\n' '#!/bin/sh' 'exec python3 "$@"' > /usr/local/bin/python
            chmod +x /usr/local/bin/python
          fi
          make -C snl-src clean OS=Windows_NT
          make -C snl-src -j4 OS=Windows_NT CC=clang EXTRA_LIBS="-lws2_32 -static"
          # A static build imports only DLLs that ship with Windows.
          llvm-objdump -p snl-src/build/snl.exe | sed -n 's/^\s*DLL Name: //p' | tr -d '\r' | tee dlls.txt
          if grep -viE '^(kernel32|msvcrt|ucrtbase|advapi32|user32|shell32|ws2_32|bcrypt|ntdll|api-ms-win-.*)\.dll$' dlls.txt; then
            echo "::error::snl.exe imports DLLs that Windows does not provide"; exit 1
          fi
      - name: Package
        run: |
          exe=snl; [ "$RUNNER_OS" = Windows ] && exe=snl.exe
          name="snl-$SNL_VERSION-${{ matrix.asset_platform }}"
          mkdir -p dist/stage/bin
          cp "snl-src/build/$exe" "dist/stage/bin/$exe"
          cp -R snl-src/builtin dist/stage/builtin
          test -f dist/stage/builtin/io/console/Console.snl
          "dist/stage/bin/$exe" --version
          if [ "$RUNNER_OS" = Windows ]; then
            (cd dist/stage && powershell -NoProfile -Command "Compress-Archive -Path bin, builtin -DestinationPath ../$name.zip")
            archive="$name.zip"
          else
            tar -czf "dist/$name.tar.gz" -C dist/stage bin builtin
            archive="$name.tar.gz"
          fi
          (cd dist && { command -v sha256sum > /dev/null && sha256sum "$archive" || shasum -a 256 "$archive"; } > "$name.sha256")
          cat "dist/$name.sha256"
      - name: Smoke test the packaged snl on this repository
        run: |
          mkdir -p check && cd check
          case "$RUNNER_OS" in
            Windows) unzip -q ../dist/*.zip ;;
            *) tar -xzf ../dist/*.tar.gz ;;
          esac
          cd ..
          exe=snl; [ "$RUNNER_OS" = Windows ] && exe=snl.exe
          make -C repo bootstrap-smoke SNL="$PWD/check/bin/$exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snl-${{ matrix.asset_platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish snl-seed release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: snl-*
          path: dist
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          ls -l dist
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --prerelease --verify-tag \
              --title "snl $SNL_VERSION seed binaries (macOS x86_64, Windows ARM64)" \
              --notes "snl $SNL_VERSION built from the official tag commit $SNL_COMMIT for the platforms the official release does not cover. Used by CI through .github/actions/setup-snl. Not a Snovalang Compiler release."
          fi
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber dist/*
