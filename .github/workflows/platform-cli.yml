name: Platform CLI builds

on:
  push:
    paths:
      - 'bootstrap/**'
      - 'ci/**'
      - 'scripts/test-native-linux-aarch64.py'
      - 'Makefile'
      - '.github/workflows/platform-cli.yml'
  pull_request:
    paths:
      - 'bootstrap/**'
      - 'ci/**'
      - 'scripts/test-native-linux-aarch64.py'
      - 'Makefile'
      - '.github/workflows/platform-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-docker:
    name: Linux ${{ matrix.arch }} CLI
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: bootstrap-cli-linux-x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: bootstrap-cli-linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and test in the pinned architecture Dockerfile
        run: make ${{ matrix.target }}

  hosted-platform-cli:
    name: ${{ matrix.platform }} CLI
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS ARM64
            runner: macos-15
            shell: bash
            msystem: ''
            packages: ''
            seed_cc: cc
            seed_cli: seed/build/snl
          - platform: macOS x86_64
            runner: macos-15-intel
            shell: bash
            msystem: ''
            packages: ''
            seed_cc: cc
            seed_cli: seed/build/snl
          - platform: Windows x86_64
            runner: windows-2025
            shell: msys2 {0}
            msystem: MINGW64
            packages: make git python mingw-w64-x86_64-gcc
            seed_cc: gcc
            seed_cli: seed/build/snl.exe
          - platform: Windows ARM64
            runner: windows-11-arm
            shell: msys2 {0}
            msystem: CLANGARM64
            packages: make git python mingw-w64-clang-aarch64-clang
            seed_cc: clang
            seed_cli: seed/build/snl.exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: snovalang/snovac
          ref: 2b5048aaf221527e22ea844f858b5d0f33f149c9
          path: seed
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: ${{ matrix.packages }}
      - name: Build the pinned seed compiler
        run: make -C seed -j2 CC=${{ matrix.seed_cc }}
      - name: Build and test the Snova CLI
        run: make bootstrap-smoke bootstrap-fixed-point bootstrap-vm bootstrap-oop
        env:
          SNL: ${{ matrix.seed_cli }}
