name: Set up moil
description: >-
  Download the v0.3.0 bootstrap seed, verify its pinned SHA-256, expose it as
  `moil` on PATH. Archive names retain their original upstream naming.
outputs:
  moil:
    description: Path to the moil executable (forward slashes, usable from bash, MSYS2 and PowerShell)
    value: ${{ steps.install.outputs.moil }}
runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        SNL_VERSION: v0.3.0
      run: |
        set -euo pipefail
        # Release snl-seed-v0.3.0 of this repository. The first three archives
        # are the official v0.3.0 archives copied unchanged (same SHA-256);
        # macOS x86_64 and Windows ARM64 were built by publish-snl-seed.yml.
        case "$RUNNER_OS-$RUNNER_ARCH" in
          macOS-ARM64)   asset=snl-$SNL_VERSION-darwin-aarch64.tar.gz;  sha=6ddee0ca86e1876398c5e68017de132aa7c05e856fdc40f540f87af08c0acf8b; exe=snl ;;
          Linux-X64)     asset=snl-$SNL_VERSION-linux-x86_64.tar.gz;    sha=f7d39f967407cdedc522b6bb1d21c199b188789dc27b00ba9e7100bc419ed8f8; exe=snl ;;
          Windows-X64)   asset=snl-$SNL_VERSION-windows-x86_64.zip;     sha=6400c05fd6371f8eb5d522f09cedcdc40149fb67c945c1b09fce0f9abbb4b988; exe=snl.exe ;;
          macOS-X64)     asset=snl-$SNL_VERSION-darwin-x86_64.tar.gz;   sha=4bea8c6167ee28a9c3588afa98d2c425b65a79c262e1059d9f1f13b49206f3d7; exe=snl ;;
          Windows-ARM64) asset=snl-$SNL_VERSION-windows-aarch64.zip;    sha=da8fcdf62f6843abab071f53428aaf63484f54483ef5f685add87eda5a089066; exe=snl.exe ;;
          *) echo "::error::no snl $SNL_VERSION binary for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
        esac
        dir="$RUNNER_TEMP/snl-$SNL_VERSION"
        if command -v cygpath > /dev/null; then dir=$(cygpath -u "$dir"); fi
        mkdir -p "$dir"
        curl -fsSL --retry 3 -o "$dir/$asset" "https://github.com/moislang/snl/releases/download/snl-seed-$SNL_VERSION/$asset"
        if command -v sha256sum > /dev/null; then actual=$(sha256sum "$dir/$asset" | cut -d' ' -f1); else actual=$(shasum -a 256 "$dir/$asset" | cut -d' ' -f1); fi
        if [ "$actual" != "$sha" ]; then echo "::error::$asset SHA-256 $actual, expected $sha"; exit 1; fi
        case "$asset" in
          *.zip) if command -v unzip > /dev/null; then unzip -q -o "$dir/$asset" -d "$dir"; else pwsh -NoProfile -Command "Expand-Archive -Force -Path '$(cygpath -w "$dir/$asset")' -DestinationPath '$(cygpath -w "$dir")'"; fi ;;
          *) tar -xzf "$dir/$asset" -C "$dir" ;;
        esac
        source_exe="$dir/bin/$exe"
        moil_exe="$dir/bin/moil${exe#snl}"
        if [ "$source_exe" != "$moil_exe" ]; then mv "$source_exe" "$moil_exe"; fi
        if command -v cygpath > /dev/null; then moil_exe=$(cygpath -m "$moil_exe"); fi
        "$moil_exe" --version
        echo "moil=$moil_exe" >> "$GITHUB_OUTPUT"
        echo "$(dirname "$moil_exe")" >> "$GITHUB_PATH"
