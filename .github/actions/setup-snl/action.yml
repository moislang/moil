name: Set up snl
description: >-
  Download the pinned official snl v0.3.0 release, verify its SHA-256 and put
  it on PATH. No source build; only the platforms with an official binary are
  supported (macOS ARM64, Linux x86_64, Windows x86_64).
outputs:
  snl:
    description: Path to the snl executable (forward slashes, usable from bash, MSYS2 and PowerShell)
    value: ${{ steps.install.outputs.snl }}
runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        SNL_VERSION: v0.3.0
      run: |
        set -euo pipefail
        # SHA-256 of the v0.3.0 release archives (snovalang/snovac releases).
        case "$RUNNER_OS-$RUNNER_ARCH" in
          macOS-ARM64) asset=snovac-darwin-aarch64.tar.gz; sha=6ddee0ca86e1876398c5e68017de132aa7c05e856fdc40f540f87af08c0acf8b; exe=snl ;;
          Linux-X64)   asset=snovac-linux-x86_64.tar.gz;  sha=f7d39f967407cdedc522b6bb1d21c199b188789dc27b00ba9e7100bc419ed8f8; exe=snl ;;
          Windows-X64) asset=snovac-windows-x86_64.zip;   sha=6400c05fd6371f8eb5d522f09cedcdc40149fb67c945c1b09fce0f9abbb4b988; exe=snl.exe ;;
          *) echo "::error::no official snl $SNL_VERSION binary for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
        esac
        dir="$RUNNER_TEMP/snl-$SNL_VERSION"
        if command -v cygpath > /dev/null; then dir=$(cygpath -u "$dir"); fi
        mkdir -p "$dir"
        curl -fsSL --retry 3 -o "$dir/$asset" "https://github.com/snovalang/snovac/releases/download/$SNL_VERSION/$asset"
        if command -v sha256sum > /dev/null; then actual=$(sha256sum "$dir/$asset" | cut -d' ' -f1); else actual=$(shasum -a 256 "$dir/$asset" | cut -d' ' -f1); fi
        if [ "$actual" != "$sha" ]; then echo "::error::$asset SHA-256 $actual, expected $sha"; exit 1; fi
        case "$asset" in
          *.zip) if command -v unzip > /dev/null; then unzip -q -o "$dir/$asset" -d "$dir"; else pwsh -NoProfile -Command "Expand-Archive -Force -Path '$(cygpath -w "$dir/$asset")' -DestinationPath '$(cygpath -w "$dir")'"; fi ;;
          *) tar -xzf "$dir/$asset" -C "$dir" ;;
        esac
        snl="$dir/bin/$exe"
        if command -v cygpath > /dev/null; then snl=$(cygpath -m "$snl"); fi
        "$snl" --version
        echo "snl=$snl" >> "$GITHUB_OUTPUT"
        echo "$(dirname "$snl")" >> "$GITHUB_PATH"
